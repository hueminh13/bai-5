
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Setting</title>
<style>
    * {box-sizing: border-box;}

    html,
    body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        overflow-x: hidden;
    }

    body {
        background: #f7f7f7;
    }

    .app {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        background: #f7f7f7;
        display: flex;
        align-items: stretch;
    }

    .sidebar {
        width: 78px;
        min-width: 78px;
        min-height: 325px;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 159px;
    }

    .nav-item {
        width: 100%;
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d4d4d4;
        position: relative;
        
    }

    .nav-item.active {
        color: #4182f9;
        background: rgba(65, 130, 249, 0.2);
    }

    .nav-item img {
        max-width: 24px;
        max-height: 24px;
    }

    .main {
        flex: 1 1 auto;
        min-width: 0;
        width: calc(100% - 78px);
        padding: 28px 39px 30px;
    }

    .topbar {
        width: 100%;
        min-height: 72px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 30px;
        margin: 4px 0 32px;
    }

    .welcome-box {
        min-width: 0;
        height: 72px;
    }

    .welcome {
        margin: 0 0 3px;
        padding: 0;
        font-size: 24px;
        line-height: 36px;
        font-weight: 500;
        color: #3e435d;
        white-space: nowrap;
    }

    .date {
        font-size: 16px;
        line-height: 24px;
        color: #ada7a7;
        white-space: nowrap;
        font-weight: 400;
    }

    .top-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 18px;
        padding-top: 7px;
        min-width: 0;
    }

    .search {
        width: clamp(220px, 27vw, 354px);
        height: 52px;
        flex: 1 1 220px;
        max-width: 354px;
        border-radius: 8px;
        background: #fff;
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 14px;
        min-width: 0;
    }

    .top-img {
        width: 24px;
        height: 24px;
        position: relative;
        flex: 0 0 24px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .top-img img {
        width: 24px;
        height: 24px;
        object-fit: contain;
    }

    .search span {
        font-size: 16px;
        color: #ada7a7;
        white-space: nowrap;
    }

    .icon-button {
        width: 52px;
        height: 52px;
        flex: 0 0 52px;
        border: 0;
        border-radius: 10px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 0;
    }

    .top-avatar {
        width: 52px;
        height: 52px;
        flex: 0 0 52px;
        border-radius: 10px;
        overflow: hidden;
    }

    .top-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .profile-shell {
        width: 100%;
        max-width: none;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
    }

    .cover {
        width: 100%;
        height: 100px;
        overflow: hidden;
    }

    .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .profile-card {
        width: 100%;
        min-height: 653px;
        padding: 32px;
        background: #fff;
    }

    .profile-head {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 25px;
    }

    .person {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 24px;
    }

    .person-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        overflow: hidden;
        flex: 0 0 100px;
    }

    .person-avatar img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .person-name {
        margin: 0 0 6px;
        font-size: 20px;
        line-height: 30px;
        font-weight: 500;
        color: #000;
        font-family: "Poppins", "Segoe UI", Arial, sans-serif;
    }

    .person-email {
        margin: 0;
        font-weight: 400;
        font-size: 16px;
        line-height: 24px;
        color: #ada7a7;
        overflow-wrap: anywhere;
    }

    .edit {
        width: 93px;
        height: 44px;
        flex: 0 0 93px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .edit img {
        display: block;
        max-width: 100%;
        max-height: 100%;
    }

    .form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 25px;
        padding-top: 30px;
    }

    .form-row {
        width: 100%;
        display: flex;
        gap: 32px;
    }

    .field {
        flex: 1 1 0;
        min-width: 0;
    }

    .label {
        display: block;
        margin: 0 0 12px;
        font-size: 16px;
        line-height: 24px;
        color: #000;
        font-weight: 400;
    }

    .input,
    .form-row select {
        width: 100%;
        height: 52px;
        border: 0;
        outline: 0;
        border-radius: 8px;
        background: #f9f9f9;
        padding: 0 20px;
        font-family: "Poppins", "Segoe UI", Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
    }

    .input {
        color: #ada7a7;
    }

    .input::placeholder {
        color: #ada7a7;
        opacity: 1;
    }

    .form-row select {
        color: #ada7a7;
        cursor: pointer;
    }

    .input.select {
        padding-right: 50px;
    }

    .email-section {
        width: 100%;
        max-width: 400px;
        margin-top: 7px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .email-title {
        margin: 0 0 26px;
        font-size: 18px;
        line-height: 27px;
        font-weight: 500;
        color: #000;
    }

    .email-item {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 0 0 26px;
        min-height: 48px;
    }

    .mail-circle {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 48px;
        position: relative;
    }

    .mail-circle img {
        width: 48px;
        height: 48px;
        object-fit: contain;
    }

    .email-value {
        font-size: 16px;
        line-height: 24px;
        color: #000;
        margin-bottom: 6px;
        font-weight: 400;
        overflow-wrap: anywhere;
    }

    .email-age {
        font-size: 16px;
        line-height: 24px;
        color: #ada7a7;
    }

    .add-email {
        display: inline-flex;
        width: auto;
        max-width: 100%;
        height: 44px;
        padding: 0;
        margin: 0;
        cursor: pointer;
    }

    .add-email img {
        display: block;
        max-width: 100%;
        height: 44px;
    }

    @media (max-width: 1200px) {
        .main {
            padding: 24px 28px 30px;
        }

        .topbar {
            gap: 20px;
        }

        .top-actions {
            gap: 12px;
        }

        .search {
            width: 260px;
            max-width: 260px;
        }

        .profile-card {
            padding-left: 40px;
            padding-right: 40px;
        }
    }

   

    @media (max-width: 430px) {
        .main {
            padding-left: 10px;
            padding-right: 10px;
        }

        .profile-card {
            padding-left: 14px;
            padding-right: 14px;
        }

        .profile-head {
            flex-direction: column;
        }

        .edit {
            align-self: flex-end;
        }

        .person {
            width: 100%;
        }

        .email-value,
        .email-age {
            font-size: 14px;
        }
    }
</style>
</head>
<body>
<section class="app">

    <nav class="sidebar">
        <div class="nav-item active">
            <img src="element-4.svg">
        </div>
        <div class="nav-item">
            <img src="graph.svg">
        </div>
        <div class="nav-item">
            <img src="medal-star.svg">
        </div>
        <div class="nav-item">
            <img src="messages.svg">
        </div>
        <div class="nav-item">
            <img src="setting-2.svg">
        </div>
    </nav>

    <section class="main">
        <header class="topbar">
            <div class="welcome-box">
                <h1 class="welcome">Welcome, Amanda</h1>
                <div class="date">Tue, 07 June 2022</div>
            </div>

            <div class="top-actions">
                <div class="search">
                    <div class="top-img">
                        <img src="search-normal.svg">
                    </div>
                    <span>Search</span>
                </div>
                <button class="icon-button" aria-label="Notifications">
                    <div class="top-img">
                        <img src="notification-bing.svg">
                    </div>
                </button>
                <div class="top-avatar">
                    <img src="Rectangle 1072.svg" alt="Profile">
                </div>
            </div>
        </header>

        <section class="profile-shell">
            <div class="cover">
                <img src="Rectangle 6691.svg">
            </div>

            <div class="profile-card">
                <div class="profile-head">
                    <div class="person">
                        <div class="person-avatar">
                            <img src="Ellipse 11.svg" alt="Alexa Rawles">
                        </div>
                        <div>
                            <h2 class="person-name">Alexa Rawles</h2>
                            <p class="person-email">alexarawles@gmail.com</p>
                        </div>
                    </div>
                    <div class="edit">
                        <img src="Group 47736.svg">
                    </div>
                </div>

                <div class="form">
                    <div class="form-row">
                        <div class="field">
                            <label class="label">Full Name</label>
                            <input class="input" type="text" placeholder="Your First Name">
                        </div>
                        <div class="field">
                            <label class="label">Nick name</label>
                            <input class="input" type="text" placeholder="Your Nick Name">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field">
                            <label class="label">Gender</label>
                            <select>
                                <option selected>Your Gender</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="label">Country</label>
                            <select>
                                <option selected>Your Country</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field">
                            <label class="label">Language</label>
                            <select>
                                <option selected>Your Language</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="label">Time Zone</label>
                            <select>
                                <option selected>Your Time Zone</option>
                            </select>
                    </div>
                </div>

                <section class="email-section">
                    <h3 class="email-title">My email Address</h3>
                    <div class="email-item">
                        <div class="mail-circle" aria-hidden="true">
                            <img src="icon.svg">
                        </div>
                        <div>
                            <div class="email-value">alexarawles@gmail.com</div>
                            <div class="email-age">1 month ago</div>
                        </div>
                    </div>
                    <div class="add-email">
                        <img src="Group 239181.svg">
                    </div>
                </section>
            </div>
        </section>
    </section>
</section>
</body>
</html>
